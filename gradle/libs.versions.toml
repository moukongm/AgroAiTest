gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
agriPestSdk = { group = "com.github.lukecc00", name = "AgriPest-Android-SDK", version.ref = "agriPestSdkVersion" }

#markwon
markwon-core = {group = "io.noties.markwon" ,name = "core", version.ref = "markwon"}
markwon-highlight = {group = "io.noties.markwon" ,name = "syntax-highlight", version.ref = "markwon"}
