# Voice
speechengine-tob = { group = "com.bytedance.speechengine", name = "speechengine_tob", version.ref = "speechengine" }

blurview = { group = "com.github.Dimezis", name = "BlurView", version.ref = "blurview" }

# huanghaibin CalendarView (从Maven Central获取)
calendarview = { group = "com.haibin", name = "calendarview", version.ref = "calendarViewVersion" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
jetbrains-kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
